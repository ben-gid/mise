[project]
name = "mise-photos"
version = "0.1.0"
description = "Holds the Pexels key so the mise app doesn't have to."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
